spring:
  datasource:
    url: ${DEV_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/postgres}}
    username: ${DEV_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${DEV_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    com.eyelesscode.task_by_task: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
