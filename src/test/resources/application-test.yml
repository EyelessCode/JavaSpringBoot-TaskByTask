spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration
  session:
    store-type: jdbc
    timeout: 7d
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        secure: false

db-scheduler:
  enabled: false
  table-name: scheduled_tasks

app:
  web-push:
    enabled: false

logging:
  level:
    root: INFO
    com.eyelesscode.task_by_task: DEBUG
    org.testcontainers: INFO
